services:
  musubi-enhanced:
    build: .
    image: sneakamaila/musubi-enhanced:latest
    container_name: musubi-enhanced
    restart: unless-stopped
    ports:
      - "5151:5151"
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
      - ./models:/app/models
    environment:
      - HOST=0.0.0.0
      - PORT=5151
      - APP_VERSION=2.1.0
      - PYTHONUNBUFFERED=1
