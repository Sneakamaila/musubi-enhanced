version: '3.8'

services:
  musubi-enhanced:
    build: .
    image: sneakamaila/musubi-enhanced:latest
    container_name: musubi-enhanced
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
      - ./models:/app/models
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - PYTHONUNBUFFERED=1
